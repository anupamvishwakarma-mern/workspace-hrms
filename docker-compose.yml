# Local development dependencies only. MongoDB runs as a single-node replica set
# so that transactions (leave balances, attendance recalculation) work.
services:
  mongo:
    image: mongo:7
    command: ['--replSet', 'rs0', '--bind_ip_all']
    ports: ['27017:27017']
    volumes: ['mongo-data:/data/db']
    healthcheck:
      test:
        [
          'CMD',
          'mongosh',
          '--quiet',
          '--eval',
          "try{rs.status().ok}catch(e){rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}).ok}",
        ]
      interval: 5s
      retries: 10
  redis:
    image: redis:7
    ports: ['6379:6379']
volumes:
  mongo-data:
